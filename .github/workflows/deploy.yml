name: Test & deploy

# Runs on every push to main, by hand, and from the daily data refresh.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checked_at:
        description: Time of the data check to publish in status.json (ISO UTC)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # include a data commit made earlier in the same run

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Type check & build
        run: npm run build
        env:
          BASE_PATH: /bg-vfr-planner/

      - name: Data-check status
        env:
          CHECKED_AT: ${{ inputs.checked_at }}
        run: |
          mkdir -p dist/data/bg
          if [ -n "$CHECKED_AT" ]; then
            printf '{"checkedAt":"%s"}\n' "$CHECKED_AT" > dist/data/bg/status.json
          else
            # code-only deploy: keep the last published check time
            curl -fsS https://yummydumpling.github.io/bg-vfr-planner/data/bg/status.json -o dist/data/bg/status.json \
              || rm -f dist/data/bg/status.json
          fi

      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
